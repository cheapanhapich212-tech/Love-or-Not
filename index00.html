<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style10.css">
    <title>Document</title>
</head>
<body>
    <form>
    <!-- Phone Number -5->
    <label>Phone number</label>
    <input type="text" placeholder="Phone number">

    <!-- Email -->
    <label>Email</label>
    <input type="email" placeholder="Please enter">

    <!-- Password -->
    <label>Password</label>
    <div class="password-wrapper">
        <input type="password" placeholder="Please enter">
        <span class="eye-icon">👁</span>
    </div>

    <!-- Verification Method Radio Buttons -->
    <div class="radio-group">
        <label><input type="radio" name="verify" checked> Phone verification</label>
        <label><input type="radio" name="verify"> Email verification</label>
    </div>

    <!-- Verification Code -->
    <div class="code-wrapper">
        <input type="text" placeholder="verification code">
        <button type="button" class="get-code-btn" weight="25px"><a href="#" >Get code</button></div>
    </div>

    <p class="hint">Password should be 6-16 digits, contains uppercase, lowercase and numbers</p>

    <!-- Terms Agreement -->
    <div class="terms-group">
        <input type="checkbox" id="terms">
        <label for="terms">Agree to the <span class="highlight">"Terms of Service"</span> and <span class="highlight">"Privacy Policy"</span></label>
    </div>

    <!-- Submit Button -->
    <button type="submit" class="next-btn" disabled>Next step</button>
</form>
</body>
</html>
